<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="100%" height="100%">
  <defs>
    <linearGradient id="gradCinza" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#424242" />
      <stop offset="100%" stop-color="#bdbdbd" />
    </linearGradient>
  </defs>

  <rect width="480" height="260" fill="#ffffff" rx="8"/>

  <!-- Retângulo proporcional a 24 x 12,5 (largura 336px, altura 175px) -->
  <rect x="35" y="30" width="336" height="175" 
        fill="url(#gradCinza)" stroke="#c2185b" stroke-width="3.5" rx="4"/>

  <!-- Medida da Base (24 m) -->
  <text x="203" y="235" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#b71c1c" text-anchor="middle">24 m</text>

  <!-- Medida da Altura (12,5 m) -->
  <text x="390" y="125" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#b71c1c" dominant-baseline="middle">12,5 m</text>
</svg>
